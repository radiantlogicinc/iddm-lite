services:
  zookeeper:
    build:
      context: ./docker/zk
      args:
        - ZOOKEEPER_VERSION=${ZOOKEEPER_VERSION}
    image: radiantone/homedepot-zookeeper:${ZOOKEEPER_VERSION}
    platform: linux/amd64
    container_name: zookeeper
    hostname: zookeeper-0
    networks:
      - fidNetwork
    profiles:
      - fid
    ports:
      - '2181:2181'
      - '2888:2888'
      - '3888:3888'
      - '8080:8080'
    environment:
      - ADMIN_PORT=8080
      - CLIENT_PORT=2181
      - ENSEMBLE_PORT=2888
      - JAVA_HOME=/opt/radiantone/rli-zookeeper-external/jdk/jre/
      - LEADERRELECTION_PORT=3888
      - METRICS_PORT=9095
      - ZOOKEEPER_FLEET_SIZE=1
    volumes:
      - '${ZK_DATA_PATH}:/opt/radiantone/rli-zookeeper-external'
    deploy:
      resources:
        limits:
          memory: 512m

#  fid:
#    build:
#      context: ./docker/zk
#      args:
#        - IDDM_VERSION=${IDDM_VERSION}
#    image: radiantone/homedepot-fid:${IDDM_VERSION}

networks:
  fidNetwork:
    driver: bridge