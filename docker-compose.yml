services:
  zookeeper:
    build:
      context: ./docker/zk
      args:
        - ZOOKEEPER_VERSION=${ZOOKEEPER_VERSION}
    image: radiantone/homedepot-zookeeper:${ZOOKEEPER_VERSION}
    platform: linux/amd64
    container_name: zookeeper
    hostname: zookeeper-0
    networks:
      - fidNetwork
    profiles:
      - fid
    ports:
      - '2181:2181'
      - '2888:2888'
      - '3888:3888'
      - '8080:8080'
    environment:
      - ADMIN_PORT=8080
      - CLIENT_PORT=2181
      - ENSEMBLE_PORT=2888
      - JAVA_HOME=/opt/radiantone/rli-zookeeper-external/jdk/jre/
      - LEADERRELECTION_PORT=3888
      - METRICS_PORT=9095
      - ZOOKEEPER_FLEET_SIZE=1
    volumes:
      - '${IDDM_DATA_ROOT}/zookeeper:/opt/radiantone/rli-zookeeper-external'
    deploy:
      resources:
        limits:
          memory: 512m

  fid:
    build:
      context: ./docker/fid
      args:
        - IDDM_VERSION=${IDDM_VERSION}
    image: radiantone/homedepot-fid:${IDDM_VERSION}
    container_name: fid
    hostname: fid-0
    networks:
      - fidNetwork
    profiles:
      - fid
    ports:
      - '7070:7070'
      - '7171:7171'
      - '9100:9100'
      - '9101:9101'
      - '2389:2389'
      - '2636:2636'
      - '8089:8089'
      - '8090:8090'
    environment:
      - GIT_DIRECTORY=/opt/radiantone/git
      - IDDM_SERVICE_ACCOUNT_USERNAME=cn=api-service-user,ou=ServiceUsers,cn=config
      - ZK=external
      - ZK_CLUSTER=homedepot-store
      - ZK_CONN_STR=zookeeper:2181
      - RADIANT_LICENSE=${IDDM_LICENSE}
      - FID_REVISION_UPDATE=true
      - FID_SERVER_JOPTS=-Xms1g -Xmx2250m
      - INSTALL_SAMPLES=false
      - FID_ADMIN_API_KEY=${FID_ADMIN_API_KEY}
      - ZK_PASSWORD=${ZOOKEEPER_PASSWORD}
      - ZK_USERNAME=${ZOOKEEPER_USERNAME}
      - FID_ROOT_USERNAME=${IDDM_ROOT_USERNAME}
      - FID_ROOT_PASSWORD=${IDDM_ROOT_PASSWORD}
      - RLI_SCHEDULER_JOPTS=-Xmx250m
      - RLI_SYNC_REALTIME_JOPTS=-Xmx128m
      - CP_SERVER_JOPTS=-Xmx250m
      - USE_CONTROL_PANEL=false
    volumes:
      - '${IDDM_DATA_ROOT}/fid/vds:/opt/radiantone/vds'
      - '${IDDM_DATA_ROOT}/git:/opt/radiantone/git'
    deploy:
      resources:
        limits:
          memory: 3000m

networks:
  fidNetwork:
    driver: bridge